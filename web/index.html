   <!-- ✅ Web Client ID meta tag -->
<meta name="google-signin-client_id" 
      content="112385527944-u9kg3b4inptnkn7sv87plvjf1atlvgr9.apps.googleusercontent.com">

<body>
  <script src="flutter.js" defer></script>
  
  <script>
    // ✅ Wait for flutter.js to load
    window.addEventListener('load', function (ev) {
      // Check if _flutter is defined
      if (typeof _flutter !== 'undefined') {
        _flutter.loader.loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: {{flutter_service_worker_version}},
          }
        }).then(function(engineInitializer) {
          return engineInitializer.initializeEngine();
        }).then(function(appRunner) {
          return appRunner.runApp();
        });
      } else {
        console.error('Flutter loader not found. Retrying...');
        // Retry after 1 second
        setTimeout(function() {
          if (typeof _flutter !== 'undefined') {
            _flutter.loader.loadEntrypoint({
              serviceWorker: {
                serviceWorkerVersion: {{flutter_service_worker_version}},
              }
            }).then(function(engineInitializer) {
              return engineInitializer.initializeEngine();
            }).then(function(appRunner) {
              return appRunner.runApp();
            });
          }
        }, 1000);
      }
    });
  </script>
</body>
</html>
